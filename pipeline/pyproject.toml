[project]
name = "idx-pipeline"
version = "0.1.0"
description = "Data pipeline for the Kompas100 stock analysis site"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
yfinance = ["yfinance>=0.2.50"]

[project.scripts]
idx-pipeline = "idx_pipeline.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/idx_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
